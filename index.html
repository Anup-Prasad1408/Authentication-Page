<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Secure Auth</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 100%; max-width: 400px; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); position: relative; }
        .form-box h2 { margin-bottom: 20px; color: #333; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #555; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .btn { width: 100%; padding: 10px; background-color: #007bff; border: none; color: white; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background-color: #0056b3; }
        .logout-btn { background-color: #dc3545; }
        .logout-btn:hover { background-color: #c82333; }
        .switch-text { margin-top: 15px; text-align: center; font-size: 14px; }
        .switch-text a { color: #007bff; text-decoration: none; }
        .switch-text a:hover { text-decoration: underline; }
        .hidden { display: none; }
        .profile-info { background: #f8f9fa; padding: 15px; border-radius: 4px; margin-bottom: 20px; }
        .profile-info p { margin-bottom: 10px; font-size: 15px; color: #333; }
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center; border-radius: 8px; }
        .modal-content { background: #222f3e; padding: 25px; border-radius: 10px; width: 90%; max-width: 320px; text-align: center; color: #fff; }
        .modal-content h3 { color: #2ed573; margin-bottom: 20px; font-size: 20px; }
        .otp-inputs { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .otp-input { width: 50px; height: 50px; text-align: center; font-size: 20px; border: 2px solid #57606f; background: transparent; color: #fff; border-radius: 6px; outline: none; }
        .otp-input:focus { border-color: #2ed573; }
    </style>
</head>
<body>

    <div class="container">
        <!-- SIGNUP FORM -->
        <div id="signup-section" class="form-box">
            <h2>Create Account</h2>
            <form id="signup-form">
                <div class="input-group"><label>Full Name</label><input type="text" id="signup-name" required></div>
                <div class="input-group"><label>Mobile Number</label><input type="tel" id="signup-mobile" required></div>
                <div class="input-group"><label>Email ID</label><input type="email" id="signup-email" required></div>
                <div class="input-group"><label>Password</label><input type="password" id="signup-password" required></div>
                <div class="input-group"><label>Confirm Password</label><input type="password" id="signup-confirm-password" required></div>
                <button type="submit" class="btn">Sign Up & Send OTP</button>
            </form>
            <p class="switch-text">Already have an account? <a href="#" id="show-login">Login</a></p>
        </div>

        <!-- LOGIN FORM -->
        <div id="login-section" class="form-box hidden">
            <h2>Student Login</h2>
            <form id="login-form">
                <div class="input-group"><label>Email ID</label><input type="email" id="login-email" required></div>
                <div class="input-group"><label>Password</label><input type="password" id="login-password" required></div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p class="switch-text"><a href="#" id="show-forgot">Forgot Password?</a></p>
            <p class="switch-text">Don't have an account? <a href="#" id="show-signup">Create Account</a></p>
        </div>

        <!-- FORGOT PASSWORD FORM -->
        <div id="forgot-section" class="form-box hidden">
            <h2>Reset Password</h2>
            <form id="forgot-form">
                <div class="input-group"><label>Registered Email ID</label><input type="email" id="forgot-email" required></div>
                <div class="input-group"><label>New Password</label><input type="password" id="forgot-new-password" required></div>
                <button type="submit" class="btn">Update Password</button>
            </form>
            <p class="switch-text"><a href="#" id="back-to-login">Back to Login</a></p>
        </div>

        <!-- STUDENT PROFILE DASHBOARD -->
        <div id="profile-section" class="form-box hidden">
            <h2>Student Profile</h2>
            <div class="profile-info">
                <p><strong>Name:</strong> <span id="profile-name"></span></p>
                <p><strong>Mobile:</strong> <span id="profile-mobile"></span></p>
                <p><strong>Email:</strong> <span id="profile-email"></span></p>
            </div>
            <button id="logout-btn" class="btn logout-btn">Logout</button>
        </div>

        <!-- OTP VERIFICATION POPUP MODAL -->
        <div id="otp-modal" class="modal hidden">
            <div class="modal-content">
                <h3>OTP VERIFICATION</h3>
                <div class="otp-inputs">
                    <input type="text" class="otp-input" maxlength="1">
                    <input type="text" class="otp-input" maxlength="1">
                    <input type="text" class="otp-input" maxlength="1">
                    <input type="text" class="otp-input" maxlength="1">
                </div>
                <button id="verify-otp-btn" class="btn" style="background-color: #2ed573;">Verify & Register</button>
            </div>
        </div>
    </div>

    <script>
        const signupSection = document.getElementById('signup-section');
        const loginSection = document.getElementById('login-section');
        const forgotSection = document.getElementById('forgot-section');
        const profileSection = document.getElementById('profile-section');
        const otpModal = document.getElementById('otp-modal');

        const signupForm = document.getElementById('signup-form');
        const loginForm = document.getElementById('login-form');
        const forgotForm = document.getElementById('forgot-form');
        const logoutBtn = document.getElementById('logout-btn');
        const verifyOtpBtn = document.getElementById('verify-otp-btn');
        const otpInputs = document.querySelectorAll('.otp-input');

        let tempUserData = null;

        document.getElementById('show-login').addEventListener('click', (e) => { e.preventDefault(); switchSec(loginSection); });
        document.getElementById('show-signup').addEventListener('click', (e) => { e.preventDefault(); switchSec(signupSection); });
        document.getElementById('show-forgot').addEventListener('click', (e) => { e.preventDefault(); switchSec(forgotSection); });
        document.getElementById('back-to-login').addEventListener('click', (e) => { e.preventDefault(); switchSec(loginSection); });

        function switchSec(sec) {
            signupSection.classList.add('hidden');
            loginSection.classList.add('hidden');
            forgotSection.classList.add('hidden');
            profileSection.classList.add('hidden');
            otpModal.classList.add('hidden');
            sec.classList.remove('hidden');
        }

        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && index < otpInputs.length - 1) otpInputs[index + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) otpInputs[index - 1].focus();
            });
        });

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value.trim();
            const mobile = document.getElementById('signup-mobile').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;

            if (password !== confirmPassword) { alert("Passwords do not match!"); return; }

            tempUserData = { name, mobile, email, password };

            try {
                const res = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    otpModal.classList.remove('hidden');
                    otpInputs[0].focus();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Server error while sending OTP.");
            }
        });

        verifyOtpBtn.addEventListener('click', async () => {
            let otp = "";
            otpInputs.forEach(inp => otp += inp.value);

            if (otp.length < 4) { alert("Enter complete 4-digit OTP."); return; }

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...tempUserData, otp })
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    signupForm.reset();
                    switchSec(loginSection);
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Verification failed.");
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    loadProfile(data.user);
                    switchSec(profileSection);
                    loginForm.reset();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Login error.");
            }
        });

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value.trim();
            const newPassword = document.getElementById('forgot-new-password').value;

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, newPassword })
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    forgotForm.reset();
                    switchSec(loginSection);
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Reset error.");
            }
        });

        function loadProfile(user) {
            document.getElementById('profile-name').textContent = user.name;
            document.getElementById('profile-mobile').textContent = user.mobile;
            document.getElementById('profile-email').textContent = user.email;
        }

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('user');
            switchSec(loginSection);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user) { loadProfile(user); switchSec(profileSection); }
        });
    </script>
</body>
</html>
