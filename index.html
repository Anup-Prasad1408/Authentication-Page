<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Single File</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .form-box h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .logout-btn {
            background-color: #dc3545;
        }

        .logout-btn:hover {
            background-color: #c82333;
        }

        .switch-text {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .switch-text a {
            color: #007bff;
            text-decoration: none;
        }

        .switch-text a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        .profile-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .profile-info p {
            margin-bottom: 10px;
            font-size: 15px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- SIGNUP FORM -->
        <div id="signup-section" class="form-box">
            <h2>Create Account</h2>
            <form id="signup-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="signup-name" required>
                </div>
                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="signup-mobile" required>
                </div>
                <div class="input-group">
                    <label>Email ID</label>
                    <input type="email" id="signup-email" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" required>
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="signup-confirm-password" required>
                </div>
                <button type="submit" class="btn">Sign Up</button>
            </form>
            <p class="switch-text">Already have an account? <a href="#" id="show-login">Login</a></p>
        </div>

        <!-- LOGIN FORM -->
        <div id="login-section" class="form-box hidden">
            <h2>Student Login</h2>
            <form id="login-form">
                <div class="input-group">
                    <label>Email ID</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p class="switch-text"><a href="#" id="show-forgot">Forgot Password?</a></p>
            <p class="switch-text">Don't have an account? <a href="#" id="show-signup">Create Account</a></p>
        </div>

        <!-- FORGOT PASSWORD FORM -->
        <div id="forgot-section" class="form-box hidden">
            <h2>Reset Password</h2>
            <form id="forgot-form">
                <div class="input-group">
                    <label>Registered Email ID</label>
                    <input type="email" id="forgot-email" required>
                </div>
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="forgot-new-password" required>
                </div>
                <button type="submit" class="btn">Update Password</button>
            </form>
            <p class="switch-text"><a href="#" id="back-to-login">Back to Login</a></p>
        </div>

        <!-- STUDENT PROFILE DASHBOARD -->
        <div id="profile-section" class="form-box hidden">
            <h2>Student Profile</h2>
            <div class="profile-info">
                <p><strong>Name:</strong> <span id="profile-name"></span></p>
                <p><strong>Mobile:</strong> <span id="profile-mobile"></span></p>
                <p><strong>Email:</strong> <span id="profile-email"></span></p>
            </div>
            <button id="logout-btn" class="btn logout-btn">Logout</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const signupSection = document.getElementById('signup-section');
        const loginSection = document.getElementById('login-section');
        const forgotSection = document.getElementById('forgot-section');
        const profileSection = document.getElementById('profile-section');

        const signupForm = document.getElementById('signup-form');
        const loginForm = document.getElementById('login-form');
        const forgotForm = document.getElementById('forgot-form');
        const logoutBtn = document.getElementById('logout-btn');

        // Navigation links
        document.getElementById('show-login').addEventListener('click', (e) => {
            e.preventDefault();
            switchSection(loginSection);
        });

        document.getElementById('show-signup').addEventListener('click', (e) => {
            e.preventDefault();
            switchSection(signupSection);
        });

        document.getElementById('show-forgot').addEventListener('click', (e) => {
            e.preventDefault();
            switchSection(forgotSection);
        });

        document.getElementById('back-to-login').addEventListener('click', (e) => {
            e.preventDefault();
            switchSection(loginSection);
        });

        function switchSection(section) {
            signupSection.classList.add('hidden');
            loginSection.classList.add('hidden');
            forgotSection.classList.add('hidden');
            profileSection.classList.add('hidden');
            
            section.classList.remove('hidden');
        }

        // Helper: Get Database (Users array from localStorage)
        function getUsers() {
            return JSON.parse(localStorage.getItem('students_db')) || [];
        }

        // Helper: Save Database
        function saveUsers(users) {
            localStorage.setItem('students_db', JSON.stringify(users));
        }

        // 1. SIGNUP LOGIC
        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('signup-name').value.trim();
            const mobile = document.getElementById('signup-mobile').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            let users = getUsers();
            
            // Check if email already exists
            const existingUser = users.find(user => user.email === email);
            if (existingUser) {
                alert("Email is already registered! Please login.");
                return;
            }

            // Save user to mock DB
            users.push({ name, mobile, email, password });
            saveUsers(users);

            alert("Account created successfully! Please login.");
            signupForm.reset();
            switchSection(loginSection);
        });

        // 2. LOGIN LOGIC
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value.front ? document.getElementById('login-email').value.trim() : document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            let users = getUsers();
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                localStorage.setItem('current_user', JSON.stringify(user));
                loadProfile(user);
                switchSection(profileSection);
                loginForm.reset();
            } else {
                alert("Invalid Email ID or Password!");
            }
        });

        // 3. PASSWORD RESET LOGIC
        forgotForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('forgot-email').value.trim();
            const newPassword = document.getElementById('forgot-new-password').value;

            let users = getUsers();
            const userIndex = users.findIndex(u => u.email === email);

            if (userIndex === -1) {
                alert("Email not found in database!");
                return;
            }

            users[userIndex].password = newPassword;
            saveUsers(users);

            alert("Password updated successfully! Please login with your new password.");
            forgotForm.reset();
            switchSection(loginSection);
        });

        // 4. LOAD PROFILE & LOGOUT LOGIC
        function loadProfile(user) {
            document.getElementById('profile-name').textContent = user.name;
            document.getElementById('profile-mobile').textContent = user.mobile;
            document.getElementById('profile-email').textContent = user.email;
        }

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('current_user');
            switchSection(loginSection);
        });

        // Check if user is already logged in on page refresh
        window.addEventListener('DOMContentLoaded', () => {
            const currentUser = JSON.parse(localStorage.getItem('current_user'));
            if (currentUser) {
                loadProfile(currentUser);
                switchSection(profileSection);
            }
        });
    </script>
</body>
</html>
